name: Bootstrap Terraform State
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Create state resource group
        run: az group create -n ${{ vars.TF_STATE_RESOURCE_GROUP }} -l centralindia
      - name: Create storage account
        run: |
          az storage account create \
            -n ${{ vars.TF_STATE_STORAGE_ACCOUNT }} \
            -g ${{ vars.TF_STATE_RESOURCE_GROUP }} \
            -l centralindia \
            --sku Standard_LRS \
            --kind StorageV2 \
            --min-tls-version TLS1_2 \
            --allow-blob-public-access false
      - name: Create blob container
        run: |
          az storage container create \
            --name tfstate \
            --account-name ${{ vars.TF_STATE_STORAGE_ACCOUNT }} \
            --auth-mode login
      - name: Enable versioning and soft delete
        run: |
          az storage account blob-service-properties update \
            --account-name ${{ vars.TF_STATE_STORAGE_ACCOUNT }} \
            --resource-group ${{ vars.TF_STATE_RESOURCE_GROUP }} \
            --enable-versioning true \
            --enable-delete-retention true \
            --delete-retention-days 14
